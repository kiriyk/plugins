# Server without a domain: Caddy on the host proxies HTTPS by IP to it (see README).
# Usage: KADR_PORT=127.0.0.1:8090 docker compose -f docker-compose.ip.yml up -d --build
services:
  kadr-sync:
    build: .
    restart: unless-stopped
    ports:
      - "${KADR_PORT:-8090}:8080"
    volumes:
      - kadr-data:/data

volumes:
  kadr-data:
